[project]
name = "types-bits"
dynamic = ["version"]
description = "Sized integer types: exhaustive Literal unions statically, Annotated bounds at runtime"
readme = "README.md"
authors = [{ name = "JP Hutchins", email = "jphutchins@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
rt = ["annotated-types>=0.7"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/types_bits"]
artifacts = ["src/types_bits/*.pyi"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/types_bits/*.pyi"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
{ include-group = "checkers" },
"annotated-types>=0.7",
"camas[mcp]>=0.1.29",
"actionlint-py>=1.7",
"zizmor>=1.28",
"pydantic>=2.11",
"pytest>=8.3",
"ruff>=0.13",
]
checkers = [
"basedpyright>=1.39",
"mypy>=2.3",
"pyrefly>=1.1",
"pyright>=1.1.411",
"ty>=0.0.63",
"zuban>=0.9",
]

[tool.uv.sources]
camas = { git = "https://github.com/JPHutchins/camas", rev = "main" }

[tool.ruff]
line-length = 100
src = ["src", "."]
extend-exclude = ["src/types_bits/__init__.pyi"]

[tool.ruff.lint]
select = [
"A",
"ANN",
"ARG",
"B",
"BLE",
"C4",
"D",
"DTZ",
"E",
"EM",
"ERA",
"EXE",
"F",
"FA",
"FBT",
"FLY",
"FURB",
"G",
"I",
"ICN",
"INP",
"INT",
"ISC",
"LOG",
"N",
"PERF",
"PIE",
"PL",
"PT",
"PTH",
"PYI",
"Q",
"RET",
"RSE",
"RUF",
"S",
"SIM",
"SLF",
"SLOT",
"T20",
"TC",
"TID",
"TRY",
"UP",
"W",
]
ignore = ["D1", "D203", "D213", "ISC001", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"src/types_bits/*.pyi" = ["PYI042", "N816"]
"fixtures/*" = ["ANN", "ARG", "F841", "INP001", "PLR2004", "T20", "PLC0415"]
"tests/*" = ["S101", "PLR2004", "INP001"]
"harness/*" = ["T20"]
"src/types_bits/__init__.py" = ["PLC0415"]
"hatch_build.py" = ["PLC0415"]

[tool.ruff.lint.pylint]
max-returns = 8
max-args = 6

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
markers = ["checker: drives a real type checker in a subprocess (slow)"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pyright]
typeCheckingMode = "strict"

[tool.ty.environment]
root = ["."]

[tool.pyrefly]
search-path = [".", "src"]
